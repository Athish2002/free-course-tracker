<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — CoursePulse Page Not Found</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('coursepulse_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="min-h-screen bg-base-200/40 text-base-content antialiased flex items-center justify-center p-4">

  <div class="card bg-base-100 border border-base-200 shadow-xl max-w-md w-full p-8 text-center flex flex-col items-center gap-4">
    <div class="w-16 h-16 rounded-2xl bg-primary/10 text-primary flex items-center justify-center font-bold text-2xl font-mono">
      404
    </div>
    
    <h1 class="text-2xl font-extrabold text-base-content">Page Not Found</h1>
    
    <p class="text-xs sm:text-sm text-base-content/70 leading-relaxed">
      The course or resource you are looking for does not exist, was moved, or the link has changed.
    </p>

    <div class="pt-2">
      <a href="./index.html" class="btn btn-primary btn-sm gap-2 text-xs">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Return to CoursePulse Catalog</span>
      </a>
    </div>
  </div>

</body>
</html>
