name: Course Link Check

on:
  schedule:
    # Run every Sunday at midnight (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: Check course links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check course links
        run: python scripts/check-catalog-health.py

      - name: Upload Health Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-health-report
          path: health-report.md

      - name: Create Pull Request If Updates Needed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly course link check report"
          branch: "auto-update/catalog-health"
          title: "Weekly course link check"
          body: |
            Weekly link check. Each course URL was requested once with a plain HTTP client.
            The report lists links that did not answer, returned an error, or redirected to another site.
            It does not check what the pages say about cost or content.
          labels: "catalog, automated-pr"
