name: Course Catalog Health & Invariant Audit

on:
  schedule:
    # Run every Sunday at midnight (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: Audit 30 Course Syllabi & URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Health & Invariant Audit
        run: python scripts/check-catalog-health.py

      - name: Upload Health Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-health-report
          path: health-report.md

      - name: Create Pull Request If Updates Needed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(catalog): automated course health audit & canonical url maintenance"
          branch: "auto-update/catalog-health"
          title: "🤖 Automated Catalog Health & Maintenance"
          body: |
            ### Automated Course Catalog Audit
            This PR was automatically generated by the weekly CoursePulse health check workflow.
            
            - **Audit Status:** Verified live against official university & foundation endpoints.
            - **Invariant Check:** Zero user progress IDs altered or removed.
            
            Please review the attached health diff before merging into `main`.
          labels: "catalog, automated-pr"
