name: CoursePulse Autonomous Verification & Deployment

on:
  schedule:
    # Autonomous 6-hour cron audit
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coursepulse-pipeline
  cancel-in-progress: false

jobs:
  test:
    name: Test & Invariant Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Test Suite
        run: |
          pytest -v

  audit-and-deploy:
    name: Audit & Deploy Dashboard
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Execute Autonomous Course Audit
        run: |
          python -m src.main

      - name: Commit & Push Changes
        run: |
          git config --local user.email "coursepulse-bot@users.noreply.github.com"
          git config --local user.name "CoursePulse Bot"
          git add data/ docs/ README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(audit): automated paywall verification & portal sync [skip ci]"
            git push origin main
          else
            echo "No changes detected across courses or portals."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
